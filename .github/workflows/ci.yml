name: CI

# 完整构建：C# 内核（自包含）+ Qt 6 前端 + 安装包（Inno / deb / rpm）。
#
# 平台覆盖策略（都由构建脚本自身做事实自证，CI 只负责编排 + 留档）：
#   · Windows x64   → windows-2022 托管 runner，出 installer\EGtools-<v>-x64.exe
#   · Linux x64     → ubuntu-24.04 托管 runner，出 .deb + .rpm
#   · Linux arm64   → ubuntu-24.04-arm 托管 runner（原生 arm64），出 .deb + .rpm
#   · Windows arm64 → ⚠️ 交叉编译需要 **VS Insiders 14.51 的 arm64 交叉工具链**
#                     和 Qt msvc2022_arm64，托管 runner 没有 ⇒ 只在手动触发时
#                     交给带 labels [self-hosted, windows, arm64-cross] 的机器。
#
# 注意：build_all.ps1 / build_linux.sh 都是"基于本机实测反推依赖"的脚本，
# 所以 CI 里用托管 runner 时依赖必须装全（尤其 Qt6Pdf / libicu / rpm）。
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_arm64:
        description: '构建 Windows arm64（需 self-hosted runner，见 workflows/ci.yml 顶部说明）'
        type: boolean
        default: false
  # 供 release.yml 复用：构建产物 artifact 会留给 caller 发布
  workflow_call:
    inputs:
      windows_arm64:
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 版本唯一真相校验：iss / build_all.ps1 / build_linux.sh 三处必须一致。
  # 这三处历史上各自硬编码，漂移只会在打 tag 时暴露 ⇒ 提前到每次推送挡住。
  version-check:
    name: 版本一致性校验
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: 提取并比对三处版本
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          iss=$(grep -oP '(?<=#define MyAppVersion ")[^"]+' build_installer.iss | head -1)
          ps1=$(grep -oP 'EGtools-\K[0-9]+\.[0-9]+\.[0-9]+(?=-)' build_all.ps1 | head -1)
          sh=$(grep -oP 'EGTOOLS_VERSION:-\K[^}]+' build_linux.sh | head -1)
          echo "iss=$iss  build_all.ps1=$ps1  build_linux.sh=$sh"
          for v in "$iss" "$ps1" "$sh"; do
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::版本格式非法: $v"; exit 1; }
            [ "$v" = "$iss" ] || { echo "::error::版本不一致: iss=$iss, 另一个=$v"; exit 1; }
          done
          echo "version=$iss" >> "$GITHUB_OUTPUT"

  # ─────────────────────────── Windows x64 ───────────────────────────
  windows-x64:
    name: Windows x64（内核 + Qt 前端 + Inno 安装包）
    needs: version-check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # ⚠️ 必须带 qtpdf 模块：预览渲染的唯一路径是 Qt PDF（PDFium），
      # CMakeLists 里 find_package(Qt6 COMPONENTS ... Pdf) 是硬依赖。
      # ⚠️ install-qt-action@v4 的输入是 `dir`（不是 install-dir），且装到
      #    <dir>/Qt/<version>/<arch>（多一层 Qt）⇒ 必须用 action 的 output
      #    `qt-root-dir` 把真实路径传给 build_all.ps1（EGTOOLS_QT_ROOT）。
      - name: 安装 Qt 6.11.2 (msvc2022_64 + QtPdf)
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # ⚠️ 不要加 modules: 'qtpdf'！aqt 无此模块（install-qt-action#352:
          #    "The packages ['qtpdf'] were not found"）。Qt 6.11 的 QtPdf 在
          #    win64_msvc2022_64 基础包里已含（本机 Qt6Pdf.dll 实证），无需单独装。
          cache: true

      # Inno Setup 用 chocolatey 静默安装；build_all.ps1 的 Find-Iscc 会按
      # Program Files / PATH 找到 ISCC.exe（本机用户目录那条只是首选）。
      - name: 安装 Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: 构建（含两级自证 + ISCC 出包）
        shell: pwsh
        env:
          # 用 action 的真实安装根（可能带版本/架构子目录），不要硬编码
          EGTOOLS_QT_ROOT: ${{ steps.qt.outputs.qt-root-dir }}
        run: |
          # action 同时设 QT_ROOT_DIR 环境变量；output 为空时用它兜底
          if (-not $env:EGTOOLS_QT_ROOT) { $env:EGTOOLS_QT_ROOT = $env:QT_ROOT_DIR }
          "Qt root: $env:EGTOOLS_QT_ROOT"
          if (-not (Test-Path "$env:EGTOOLS_QT_ROOT\lib\cmake\Qt6\Qt6Config.cmake")) {
            Write-Host "::error::Qt6 CMake 配置不存在：$env:EGTOOLS_QT_ROOT（前端会跳过 → 出空包）"
            throw "Qt6 CMake 配置不存在（QT_ROOT_DIR=$env:QT_ROOT_DIR, output=$env:EGTOOLS_QT_ROOT）"
          }
          # ⚠️ 不能用 Tee-Object/管道包构建：管道会吞 $LASTEXITCODE（项目踩过的坑）。
          #    用重定向到文件，退出码直接来自脚本本身。
          .\build_all.ps1 *> build_ci.log
          $rc = $LASTEXITCODE
          Get-Content build_ci.log
          exit $rc

      - name: Windows 失败诊断
        if: failure()
        shell: pwsh
        run: |
          Write-Host "::error::Windows 构建失败，日志尾部："
          if (Test-Path build_ci.log) {
            Get-Content build_ci.log -Tail 80 | ForEach-Object { "  | $_" }
          } else { "（无日志文件，失败可能在 Qt/依赖安装阶段）" }

      # 事实检查：不是只看"文件存在"，而是真启动 + 安装包体积 + 架构断言。
      # build_all.ps1 内部已做；这里再做一层独立的产物校验，防止脚本被改坏。
      - name: 校验产物
        shell: pwsh
        run: |
          $v = '${{ needs.version-check.outputs.version }}'
          $pkg = "installer\EGtools-$v-x64.exe"
          if (-not (Test-Path $pkg)) { throw "安装包缺失: $pkg" }
          $size = (Get-Item $pkg).Length
          if ($size -lt 40MB) { throw "安装包过小: $size bytes（载荷缺失）" }
          $exe = "DIST\EGtoolsFrontend\EGtoolsFrontend.exe"
          if (-not (Test-Path $exe)) { throw "前端 exe 缺失: $exe" }
          $ver = (& $exe --version 2>&1 | Out-String).Trim()
          if ($ver -notmatch 'Release') { throw "前端不是 Release 构建: $ver" }
          $ver = (& $exe --version 2>&1 | Out-String).Trim()
          "安装包: $pkg ($([math]::Round($size/1MB,1)) MB)"
          "前端自报: $ver"

      - name: 归集安装包
        shell: pwsh
        run: |
          $v = '${{ needs.version-check.outputs.version }}'
          New-Item -ItemType Directory -Path release-staging -Force | Out-Null
          Copy-Item "installer\EGtools-$v-x64.exe" "release-staging\EGtools-$v-x64.exe" -Force
          Get-ChildItem release-staging | Format-Table Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-x64
          path: release-staging/*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x64
          path: DIST/**
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────── Linux x64 ───────────────────────────
  linux-x64:
    name: Linux x64（内核 + Qt 前端 + deb/rpm）
    needs: version-check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # ⚠️ 依赖三层（只装 dt-needed 会漏 dlopen 的 libicu/libssl）：
      # libicu 缺失 ⇒ .NET 启动即 FailFast；libssl/libcrypto 供 OpenCV/网络。
      # 土耳其语图纸依赖 ICU locale 规则，不能用 InvariantGlobalization 绕过。
      - name: 安装构建与运行依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ binutils file \
            qt6-base-dev qt6-pdf-dev \
            dpkg-dev rpm

      - name: 构建（含 ELF 架构断言 + deb/rpm 内容校验）
        env:
          EGTOOLS_VERSION: ${{ needs.version-check.outputs.version }}
        run: chmod +x build_linux.sh && ./build_linux.sh

      - name: 校验产物
        shell: bash
        run: |
          set -euo pipefail
          test -x DIST-linux/EGtoolsFrontend/EGtoolsFrontend || { echo "::error::前端 ELF 缺失"; exit 1; }
          shopt -s nullglob
          pkgs=(EGtools.Frontend/build-linux/*.deb EGtools.Frontend/build-linux/*.rpm)
          [ ${#pkgs[@]} -gt 0 ] || { echo "::error::没有产出 deb/rpm"; exit 1; }
          printf '  OK  %s\n' "${pkgs[@]##*/}"

      # CPack 产出的包名不带架构（egtools-<v>-Linux.deb），x64/arm64 同名会在
      # release 汇总时互相覆盖 ⇒ 这里统一重命名为带架构的版本，并只上传 staging。
      - name: 归集安装包（带架构后缀）
        shell: bash
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-staging
          for f in EGtools.Frontend/build-linux/*.deb EGtools.Frontend/build-linux/*.rpm; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            ext="${base##*.}"
            cp -f "$f" "release-staging/egtools-$VERSION-x64.$ext"
          done
          ls -lh release-staging/

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-x64
          path: release-staging/*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-x64
          path: DIST-linux/**
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────── Linux arm64 ───────────────────────────
  # GitHub 托管 arm64 runner：原生 aarch64，无需交叉编译 Qt（x64 上编不了）。
  linux-arm64:
    name: Linux arm64（内核 + Qt 前端 + deb/rpm）
    needs: version-check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 安装构建与运行依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++ binutils file \
            qt6-base-dev qt6-pdf-dev \
            dpkg-dev rpm

      - name: 构建 arm64（aarch64 原生）
        env:
          EGTOOLS_VERSION: ${{ needs.version-check.outputs.version }}
        shell: bash
        run: |
          chmod +x build_linux.sh
          # 直接运行（退出码=脚本退出码，不被管道吞）；日志同时写文件供失败步骤读取
          ./build_linux.sh --arch arm64 > /tmp/egtools-arm64-build.log 2>&1
          rc=$?
          cat /tmp/egtools-arm64-build.log
          exit $rc

      - name: arm64 失败诊断
        if: failure()
        shell: bash
        run: |
          echo "::error::arm64 构建失败，日志尾部："
          tail -80 /tmp/egtools-arm64-build.log 2>/dev/null | sed 's/^/  | /' || echo "（无日志文件）"

      - name: 校验产物（e_machine 必须是 b700 / aarch64）
        shell: bash
        run: |
          set -euo pipefail
          elf="DIST-linux-arm64/EGtoolsFrontend/EGtoolsFrontend"
          test -x "$elf" || { echo "::error::前端 ELF 缺失"; exit 1; }
          m=$(od -An -tx1 -j18 -N2 "$elf" | tr -d ' \n')
          [ "$m" = "b700" ] || { echo "::error::前端不是 arm64（e_machine=$m）"; exit 1; }
          shopt -s nullglob
          pkgs=(EGtools.Frontend/build-linux/*.deb EGtools.Frontend/build-linux/*.rpm)
          [ ${#pkgs[@]} -gt 0 ] || { echo "::error::没有产出 deb/rpm"; exit 1; }
          printf '  OK  %s\n' "${pkgs[@]##*/}"

      # 同 x64：CPack 包名不含架构，必须重命名以免 release 汇总时覆盖 x64 包。
      - name: 归集安装包（带架构后缀）
        shell: bash
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-staging
          for f in EGtools.Frontend/build-linux/*.deb EGtools.Frontend/build-linux/*.rpm; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            ext="${base##*.}"
            cp -f "$f" "release-staging/egtools-$VERSION-arm64.$ext"
          done
          ls -lh release-staging/

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-linux-arm64
          path: release-staging/*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-arm64
          path: DIST-linux-arm64/**
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────── Windows arm64（手动 + 自托管） ───────────────────────────
  # 前置条件（缺一不可，job 里有显式探测）：
  #   1. 自托管 runner，labels 含 self-hosted / windows / arm64-cross
  #   2. VS Insiders 14.51.36231（提供 Hostx64\arm64 交叉编译器 + arm64 CRT）
  #   3. Qt 6.11.2 msvc2022_arm64（官方 cross_compiled 包，含 Qt6Pdf）
  windows-arm64:
    name: Windows arm64（交叉编译 + Inno 安装包，手动）
    if: ${{ inputs.windows_arm64 == true }}
    needs: version-check
    runs-on: [self-hosted, windows, arm64-cross]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: 探测交叉工具链前置条件
        shell: pwsh
        run: |
          $cl = Get-ChildItem 'C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\bin\Hostx64\arm64\cl.exe' -EA SilentlyContinue | Select-Object -First 1
          if (-not $cl) { throw '缺少 arm64 交叉编译器（需 VS Insiders 14.51.36231 的 Hostx64\arm64\cl.exe）。' }
          if (-not (Test-Path 'C:\Qt\6.11.2\msvc2022_arm64\lib\cmake\Qt6\Qt6Config.cmake')) {
            throw '缺少 Qt 6.11.2 msvc2022_arm64（官方 cross_compiled，需含 Qt6Pdf）。'
          }
          "交叉编译器: $($cl.FullName)"

      - name: 构建（架构断言代替真机启动 —— x64 宿主跑不了 arm64）
        shell: pwsh
        run: .\build_all.ps1 -Arch arm64

      - name: 校验产物
        shell: pwsh
        run: |
          $v = '${{ needs.version-check.outputs.version }}'
          $pkg = "installer\EGtools-$v-arm64.exe"
          if (-not (Test-Path $pkg)) { throw "安装包缺失: $pkg" }
          $size = (Get-Item $pkg).Length
          if ($size -lt 40MB) { throw "安装包过小: $size bytes" }
          # PE machine 必须是 0xAA64；build_all.ps1 已对 exe + 原生库做过断言
          $fs = [IO.File]::OpenRead("DIST-arm64\EGtoolsFrontend\EGtoolsFrontend.exe")
          try {
            $br = New-Object IO.BinaryReader($fs)
            [void]$br.ReadUInt16()
            $fs.Position = 0x3C
            $pe = $br.ReadUInt32(); $fs.Position = $pe
            [void]$br.ReadUInt32()
            $machine = $br.ReadUInt16()
          } finally { $fs.Dispose() }
          if ($machine -ne 0xAA64) { throw "前端不是 ARM64（machine=0x$('{0:X}' -f $machine)）" }
          "安装包: $pkg ($([math]::Round($size/1MB,1)) MB)，PE machine=0xAA64"

      - name: 归集安装包
        shell: pwsh
        run: |
          $v = '${{ needs.version-check.outputs.version }}'
          New-Item -ItemType Directory -Path release-staging -Force | Out-Null
          Copy-Item "installer\EGtools-$v-arm64.exe" "release-staging\EGtools-$v-arm64.exe" -Force
          Get-ChildItem release-staging | Format-Table Name,Length

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-windows-arm64
          path: release-staging/*
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-arm64
          path: DIST-arm64/**
          if-no-files-found: error
          retention-days: 7
